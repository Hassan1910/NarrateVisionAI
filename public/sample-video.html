<!DOCTYPE html>
<html>
<head>
  <title>Generated Video</title>
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      background: #000; 
      display: flex; 
      flex-direction: column;
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      color: white;
      font-family: Arial, sans-serif;
    }
    .container {
      width: 80%;
      max-width: 800px;
      text-align: center;
    }
    img { 
      max-width: 100%; 
      max-height: 70vh; 
      object-fit: contain; 
      margin-bottom: 20px;
      border: 1px solid #333;
    }
    .text {
      margin-top: 20px;
      padding: 10px;
      background: rgba(0,0,0,0.5);
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Your Generated Content</h2>
    <div id="imageContainer">
      <!-- Image will be inserted here by JavaScript -->
    </div>
    <div class="text" id="textContainer">
      <!-- Text will be inserted here by JavaScript -->
    </div>
  </div>

  <script>
    // Get query parameters
    const urlParams = new URLSearchParams(window.location.search);
    const imageUrl = urlParams.get('image');
    const text = urlParams.get('text');
    
    // Set the image if provided
    if (imageUrl) {
      const img = document.createElement('img');
      img.src = imageUrl;
      img.alt = 'Generated image';
      document.getElementById('imageContainer').appendChild(img);
    }
    
    // Set the text if provided
    if (text) {
      document.getElementById('textContainer').textContent = text;
    }
  </script>
</body>
</html>
